[package]
name = "nowplaying"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
