name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach the binaries to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: nowplaying-windows-x64.exe, bin: nowplaying.exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: nowplaying-linux-x64, bin: nowplaying }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: nowplaying-darwin-arm64, bin: nowplaying }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: nowplaying-darwin-x64, bin: nowplaying }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --release
        # The x64 macOS binary is cross-built on an arm64 runner, so its tests can't run there.
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --target ${{ matrix.target }}
      - shell: bash
        run: mkdir dist && cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  # One job publishes everything, so the matrix jobs don't race to create the release.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
