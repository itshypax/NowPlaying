<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap">
<style>
  :root {
    --bg: #0e1116;
    --panel: #171c24;
    --panel-2: #1e2530;
    --border: #2a3341;
    --text: #e8eaed;
    --muted: #8b95a5;
    --accent: #c084fc;
    --ok: #4ade80;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  h1, h2 { font-family: "Outfit", system-ui, sans-serif; }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  h1 { margin: 0; font-size: 20px; }
  header .sub { color: var(--muted); font-size: 13px; flex: 1; }
  #langSwitch {
    display: flex;
    gap: 2px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
    align-self: center;
  }
  #langSwitch button {
    background: transparent;
    color: var(--muted);
    border: 0;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  #langSwitch button.active { background: var(--panel-2); color: var(--text); }
  main {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 24px;
    padding: 24px 28px;
    max-width: 1200px;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
  }
  h2 { margin: 0 0 14px; font-size: 15px; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 12px 0 4px; }
  label.check {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    font-size: 13px;
    margin: 10px 0;
    cursor: pointer;
  }
  label.check input { accent-color: var(--accent); width: 15px; height: 15px; }
  input[type="text"], select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
    font: inherit;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input[type="color"] {
    width: 100%;
    height: 36px;
    padding: 3px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .range-row { display: flex; align-items: center; gap: 10px; }
  .range-row output { min-width: 46px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  button {
    background: var(--accent);
    color: #14081f;
    border: 0;
    border-radius: 8px;
    padding: 9px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button:hover { filter: brightness(1.1); }
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
  }
  .pill.ok { background: rgba(74, 222, 128, 0.15); color: var(--ok); }
  .pill.warn { background: rgba(251, 191, 36, 0.15); color: var(--warn); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .hint a { color: var(--accent); }
  .hint code {
    background: var(--panel-2);
    padding: 1px 5px;
    border-radius: 4px;
    user-select: all;
  }
  #preview-wrap { position: sticky; top: 24px; }
  #scene {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
    background:
      radial-gradient(ellipse at 70% 20%, #1d2f4a 0%, transparent 55%),
      radial-gradient(ellipse at 20% 85%, #2a1d3f 0%, transparent 50%),
      #0a0d12;
  }
  #scene::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  #scene .tag {
    position: absolute;
    top: 10px;
    left: 12px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  #preview {
    position: absolute;
    left: 24px;
    bottom: 24px;
    border: 0;
    background: transparent;
    transform-origin: bottom left;
  }
  #url-row { display: flex; gap: 8px; margin-top: 6px; }
  #url-row input { flex: 1; font-size: 12px; color: var(--muted); }
  #copied { color: var(--ok); font-size: 12px; margin-left: 4px; opacity: 0; transition: opacity .3s; }
  #copied.show { opacity: 1; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>
<body>
<header>
  <h1>Now Playing</h1>
  <span class="sub" data-i18n="sub"></span>
  <div id="langSwitch">
    <button data-lang="de">DE</button>
    <button data-lang="en">EN</button>
  </div>
</header>
<main>
  <div>
    <section id="auth">
      <h2>Spotify <span id="authState" class="pill warn"></span></h2>
      <div id="authSetup">
        <p class="hint" id="setupHint" style="margin-top:0"></p>
        <label for="clientId" data-i18n="clientId"></label>
        <input type="text" id="clientId" placeholder="4f2a…" autocomplete="off">
        <div style="margin-top:10px; display:flex; gap:8px;">
          <button id="saveId" class="secondary" data-i18n="save"></button>
          <button id="connect" data-i18n="connect"></button>
        </div>
      </div>
      <p id="authDone" class="hint" style="display:none; margin:0" data-i18n="authDone"></p>
    </section>

    <section>
      <h2 data-i18n="appearance"></h2>

      <label for="labelText" data-i18n="labelText"></label>
      <input type="text" id="labelText" value="Currently Playing">

      <label class="check"><input type="checkbox" id="compactOn"> <span data-i18n="compactOn"></span></label>

      <label for="coverMode" data-i18n="cover"></label>
      <select id="coverMode">
        <option value="left" data-i18n="coverLeft"></option>
        <option value="backdrop" data-i18n="coverBackdrop"></option>
        <option value="both" data-i18n="coverBoth"></option>
        <option value="none" data-i18n="coverNone"></option>
      </select>

      <label for="styleSel" data-i18n="progress"></label>
      <select id="styleSel">
        <option value="line" data-i18n="styleLine"></option>
        <option value="static" data-i18n="styleStatic"></option>
        <option value="comet" data-i18n="styleComet"></option>
        <option value="liquid" data-i18n="styleLiquid"></option>
        <option value="wave" data-i18n="styleWave"></option>
      </select>

      <div id="bgOpts">
        <div class="row2">
          <div>
            <label for="bgColor" data-i18n="bgColor"></label>
            <input type="color" id="bgColor" value="#101216">
          </div>
          <div>
            <label for="bgOpacity" data-i18n="bgOpacity"></label>
            <div class="range-row">
              <input type="range" id="bgOpacity" min="0" max="100" step="1" value="82">
              <output id="bgOpacityOut">82 %</output>
            </div>
          </div>
        </div>
      </div>

      <div class="row2">
        <div>
          <label for="radius" data-i18n="radius"></label>
          <div class="range-row">
            <input type="range" id="radius" min="0" max="32" value="16">
            <output id="radiusOut">16 px</output>
          </div>
        </div>
        <div>
          <label for="width" data-i18n="width"></label>
          <div class="range-row">
            <input type="range" id="width" min="320" max="640" step="10" value="420">
            <output id="widthOut">420 px</output>
          </div>
        </div>
      </div>

      <label for="fontSel" data-i18n="font"></label>
      <select id="fontSel">
        <option value="system" data-i18n="fontSystem"></option>
        <option value="inter">Inter</option>
        <option value="outfit">Outfit</option>
        <option value="sora">Sora</option>
        <option value="space-grotesk">Space Grotesk</option>
        <option value="jetbrains-mono">JetBrains Mono</option>
        <option value="custom" data-i18n="fontCustom"></option>
      </select>
      <input type="text" id="fontCustomName" style="display:none; margin-top:8px">
    </section>

    <section>
      <h2 data-i18n="behavior"></h2>

      <label class="check"><input type="checkbox" id="animOn" checked> <span data-i18n="animOn"></span></label>
      <div id="animOpts">
        <label for="animStyleSel" data-i18n="animStyle"></label>
        <select id="animStyleSel">
          <option value="slide" data-i18n="animSlide"></option>
          <option value="fade" data-i18n="animFade"></option>
          <option value="board" data-i18n="animBoard"></option>
          <option value="drop" data-i18n="animDrop"></option>
          <option value="spin" data-i18n="animSpin"></option>
          <option value="glitch" data-i18n="animGlitch"></option>
          <option value="arrows" data-i18n="animArrows"></option>
        </select>
      </div>
      <label class="check"><input type="checkbox" id="nextOn"> <span data-i18n="nextOn"></span></label>

      <div id="nextOpts" style="display:none">
        <label for="nextSec" data-i18n="nextSec"></label>
        <div class="range-row">
          <input type="range" id="nextSec" min="5" max="30" step="1" value="15">
          <output id="nextSecOut">15 s</output>
        </div>
        <label for="nextLabel" data-i18n="nextLabel"></label>
        <input type="text" id="nextLabel" value="Als Nächstes">
      </div>
    </section>

    <section>
      <h2 data-i18n="urlTitle"></h2>
      <p class="hint" style="margin-top:0" data-i18n="urlHint"></p>
      <div id="url-row">
        <input type="text" id="urlOut" readonly>
        <button id="copyUrl" class="secondary" data-i18n="copy"></button>
      </div>
      <span id="copied" data-i18n="copied"></span>
    </section>
  </div>

  <div id="preview-wrap">
    <div id="scene">
      <span class="tag" data-i18n="preview"></span>
      <iframe id="preview" width="700" height="280"></iframe>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);

const STR = {
  de: {
    sub: "Overlay für OBS, gespeist aus Spotify",
    notConnected: "nicht verbunden",
    connected: "verbunden",
    setupHint: 'Einmalig unter <a href="https://developer.spotify.com/dashboard" target="_blank">developer.spotify.com/dashboard</a> eine App anlegen und als Redirect-URI <code id="redirectUri"></code> eintragen. Die Client-ID der App kommt hier rein:',
    clientId: "Client-ID",
    save: "Speichern",
    saved: "Gespeichert",
    saveFail: "Speichern fehlgeschlagen",
    invalidClientId: "Client-ID sieht nicht gültig aus",
    connect: "Mit Spotify verbinden",
    authDone: "Verbunden. Das Overlay zeigt, was auf deinem Account gerade läuft, egal auf welchem Gerät.",
    appearance: "Darstellung",
    labelText: "Beschriftung (leer lassen zum Ausblenden)",
    compactOn: "Kompaktmodus (eine Zeile, kleineres Cover)",
    cover: "Cover",
    coverLeft: "Links neben dem Titel",
    coverBackdrop: "Als Backdrop (unscharf hinter dem Widget)",
    coverBoth: "Beides",
    coverNone: "Gar nicht",
    bgColor: "Hintergrundfarbe",
    bgOpacity: "Deckkraft",
    progress: "Fortschrittsanzeige",
    styleLine: "Linie (Gespieltes bewegt sich, Rest gerade)",
    styleStatic: "Linie ohne Animation",
    styleComet: "Komet",
    styleLiquid: "Liquid",
    styleWave: "Waveform",
    radius: "Eckenrundung",
    width: "Breite",
    font: "Schrift",
    fontSystem: "System",
    fontCustom: "Eigene (lokal installiert)…",
    fontPlaceholder: "Fontname, z. B. Bahnschrift",
    behavior: "Verhalten",
    animOn: "Animation beim Songwechsel",
    animStyle: "Wechsel-Animation",
    animSlide: "Slide (seitlich, mit Lichtstreif)",
    animFade: "Fade (ruhiger Crossfade)",
    animBoard: "Board (kippt wie eine Anzeigetafel)",
    animDrop: "Drop (fällt raus, federt rein)",
    animSpin: "Spin (Cover dreht wie eine Platte)",
    animGlitch: "Glitch (RGB-Versatz)",
    animArrows: "Arrows (Pfeile schieben durch)",
    nextOn: "\u201eAls Nächstes\u201c vor Songende einblenden",
    nextSec: "Einblenden vor Songende",
    nextLabel: "Beschriftung des Banners (leer = ausblenden)",
    nextDefault: "Als Nächstes",
    urlTitle: "Overlay-URL",
    urlHint: "In OBS als Browserquelle einfügen. Breite der Quelle etwas größer wählen als die Widget-Breite, Höhe ca. 300 px. Hintergrund ist transparent.",
    copy: "Kopieren",
    copied: "Kopiert",
    preview: "Vorschau",
  },
  en: {
    sub: "Overlay for OBS, fed by Spotify",
    notConnected: "not connected",
    connected: "connected",
    setupHint: 'Create an app once at <a href="https://developer.spotify.com/dashboard" target="_blank">developer.spotify.com/dashboard</a> and add <code id="redirectUri"></code> as its redirect URI. Then paste the app\'s client ID here:',
    clientId: "Client ID",
    save: "Save",
    saved: "Saved",
    saveFail: "Saving failed",
    invalidClientId: "That client ID doesn't look valid",
    connect: "Connect Spotify",
    authDone: "Connected. The overlay shows whatever is playing on your account, no matter which device.",
    appearance: "Appearance",
    labelText: "Label (leave empty to hide)",
    compactOn: "Compact mode (single line, smaller cover)",
    cover: "Cover art",
    coverLeft: "Left of the title",
    coverBackdrop: "As backdrop (blurred behind the widget)",
    coverBoth: "Both",
    coverNone: "None",
    bgColor: "Background color",
    bgOpacity: "Opacity",
    progress: "Progress display",
    styleLine: "Line (played part moves, rest stays straight)",
    styleStatic: "Line without animation",
    styleComet: "Comet",
    styleLiquid: "Liquid",
    styleWave: "Waveform",
    radius: "Corner radius",
    width: "Width",
    font: "Font",
    fontSystem: "System",
    fontCustom: "Custom (installed locally)…",
    fontPlaceholder: "Font name, e.g. Bahnschrift",
    behavior: "Behavior",
    animOn: "Animate song changes",
    animStyle: "Change animation",
    animSlide: "Slide (sideways, with light sweep)",
    animFade: "Fade (calm crossfade)",
    animBoard: "Board (flips like a departure board)",
    animDrop: "Drop (falls out, bounces in)",
    animSpin: "Spin (cover spins like a record)",
    animGlitch: "Glitch (RGB split)",
    animArrows: "Arrows (chevrons push through)",
    nextOn: "Show \u201cUp Next\u201d before the song ends",
    nextSec: "Show before end of song",
    nextLabel: "Banner label (leave empty to hide)",
    nextDefault: "Up Next",
    urlTitle: "Overlay URL",
    urlHint: "Add as a browser source in OBS. Make the source a bit wider than the widget, height about 300 px. The background is transparent.",
    copy: "Copy",
    copied: "Copied",
    preview: "Preview",
  },
};

let lang = localStorage.getItem("lang") ?? "en";
let redirectUri = "";
let authed = false;
let liveData = false;

function t(key) { return STR[lang][key]; }

function applyLang(prev) {
  document.documentElement.lang = lang;
  localStorage.setItem("lang", lang);
  document.querySelectorAll("#langSwitch button").forEach((b) =>
    b.classList.toggle("active", b.dataset.lang === lang)
  );
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.dataset.i18n);
  });
  $("setupHint").innerHTML = t("setupHint");
  $("redirectUri").textContent = redirectUri;
  $("fontCustomName").placeholder = t("fontPlaceholder");
  $("authState").textContent = authed ? t("connected") : t("notConnected");
  // switch the banner default along with the language, but only if untouched
  const nl = $("nextLabel");
  if (prev && nl.value === STR[prev].nextDefault) {
    nl.value = t("nextDefault");
  } else if (!prev && (nl.value === STR.de.nextDefault || nl.value === STR.en.nextDefault)) {
    nl.value = t("nextDefault");
  }
  update();
}

document.querySelectorAll("#langSwitch button").forEach((b) =>
  b.addEventListener("click", () => {
    const prev = lang;
    lang = b.dataset.lang;
    applyLang(prev);
  })
);

function buildQuery() {
  const q = new URLSearchParams();
  const label = $("labelText").value;
  if (label !== "Currently Playing") q.set("label", label);
  const r = $("radius").value;
  if (r !== "16") q.set("r", r);
  const cover = $("coverMode").value;
  if (cover !== "left") q.set("cover", cover);
  const noBackdrop = cover === "left" || cover === "none";
  if (noBackdrop) {
    const bg = $("bgColor").value.slice(1).toLowerCase();
    if (bg !== "101216") q.set("bg", bg);
    const bgo = $("bgOpacity").value;
    if (bgo !== "82") q.set("bgo", bgo);
  }
  const w = $("width").value;
  if (w !== "420") q.set("w", w);
  if ($("compactOn").checked) q.set("compact", "1");
  const style = $("styleSel").value;
  if (style !== "line") q.set("style", style);
  let font = $("fontSel").value;
  if (font === "custom") font = $("fontCustomName").value.trim() || "system";
  if (font !== "system") q.set("font", font);
  if (!$("animOn").checked) q.set("anim", "0");
  else if ($("animStyleSel").value !== "slide") q.set("animstyle", $("animStyleSel").value);
  if ($("nextOn").checked) {
    q.set("next", $("nextSec").value);
    const nl = $("nextLabel").value.trim();
    // "Als Nächstes" is the overlay-side default; empty = hide the label
    if (nl !== "Als Nächstes") q.set("nextlabel", nl);
  }
  return q;
}

let debounce;
function update() {
  $("radiusOut").textContent = $("radius").value + " px";
  $("widthOut").textContent = $("width").value + " px";
  $("nextSecOut").textContent = $("nextSec").value + " s";
  $("bgOpacityOut").textContent = $("bgOpacity").value + " %";
  const cm = $("coverMode").value;
  $("bgOpts").style.display = (cm === "left" || cm === "none") ? "block" : "none";
  $("fontCustomName").style.display = $("fontSel").value === "custom" ? "block" : "none";
  $("nextOpts").style.display = $("nextOn").checked ? "block" : "none";
  $("animOpts").style.display = $("animOn").checked ? "block" : "none";

  const q = buildQuery();
  const qs = q.toString();
  $("urlOut").value = location.origin + "/overlay" + (qs ? "?" + qs : "");

  clearTimeout(debounce);
  debounce = setTimeout(() => {
    const pq = new URLSearchParams(q);
    if (!liveData) pq.set("demo", "1");
    $("preview").src = "/overlay?" + pq.toString();
    scalePreview();
  }, 250);
}

function scalePreview() {
  // show the widget roughly at stream size inside the 16:9 scene (1080p reference)
  const scene = $("scene").getBoundingClientRect();
  const scale = scene.width / 1920 * 2.2;
  $("preview").style.transform = "scale(" + scale.toFixed(3) + ")";
}
window.addEventListener("resize", scalePreview);

document.querySelectorAll("input, select").forEach((el) => {
  if (el.id === "clientId") return;
  el.addEventListener("input", update);
});

$("copyUrl").addEventListener("click", async () => {
  await navigator.clipboard.writeText($("urlOut").value);
  $("copied").classList.add("show");
  setTimeout(() => $("copied").classList.remove("show"), 1500);
});

async function saveClientId() {
  const res = await fetch("/api/client-id", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ client_id: $("clientId").value }),
  });
  if (!res.ok) {
    const err = (await res.json()).error;
    alert(err === "invalid_client_id" ? t("invalidClientId") : t("saveFail"));
    return false;
  }
  return true;
}

$("saveId").addEventListener("click", async () => {
  if (await saveClientId()) {
    $("saveId").textContent = t("saved");
    setTimeout(() => ($("saveId").textContent = t("save")), 1500);
  }
});

$("connect").addEventListener("click", async () => {
  // save the client ID along the way, then go straight to login
  if ($("clientId").value.trim() && !(await saveClientId())) return;
  location.href = "/login";
});

async function init() {
  const status = await (await fetch("/api/status")).json();
  redirectUri = status.redirect_uri;
  authed = status.authed;
  if (authed) {
    $("authState").className = "pill ok";
    $("authSetup").style.display = "none";
    $("authDone").style.display = "block";
    // something playing? then use live data in the preview instead of demo
    const np = await (await fetch("/api/now-playing")).json();
    liveData = Boolean(np.title);
  }
  applyLang();
}
applyLang();
init();
</script>
</body>
</html>
